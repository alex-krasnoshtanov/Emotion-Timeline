name: Publish images

# Two images from one Dockerfile, matching the split in pyproject.toml's extras:
#
#   :study   core + web. Every command that reads a committed record, and the
#            page serving the committed example. No torch, no ffmpeg, 592 MB.
#   :latest  the whole pipeline, from a link or a file, built against CUDA.
#            12.1 GB, most of it kernels. Runs on the CPU without a card, and
#            takes minutes instead of about one.
#
# A tag publishes a version. A push to main republishes :edge, so the image and
# the branch cannot drift. A pull request builds both and runs them, and pushes
# nothing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  publish:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # No torch in this one, so building for Apple Silicon under emulation
          # costs a couple of minutes rather than most of an hour.
          - target: study
            prefix: "study-"
            platforms: linux/amd64,linux/arm64
            ffmpeg: "False"
            # Cheap to scan, so it gets a bill of materials, and small
            # enough that caching every intermediate layer is free.
            sbom: "true"
            cache: max
          - target: app
            prefix: ""
            platforms: linux/amd64
            ffmpeg: "True"
            # Scanning eleven gigabytes of CUDA layers costs minutes and tells
            # nobody anything they could not read in uv.lock. `mode=min` for
            # the same reason: the expensive layer is in the final image
            # anyway, so `max` would upload eleven gigabytes twice.
            sbom: "false"
            cache: min
    steps:
      - uses: actions/checkout@v7

      # A hosted runner ships with several gigabytes of toolchains this build
      # never touches, and the CUDA image does not fit alongside them.
      - name: Make room for the CUDA layers
        if: matrix.target == 'app'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}"
          df -h /

      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v3

      # `docker/metadata-action` lowercases the image name for us and a raw ref
      # in `cache-to` does not, so `Emotion-Timeline` would be rejected by the
      # registry. The layer cache also gets a package of its own rather than
      # half a dozen `buildcache-*` tags on the one people actually pull.
      - name: A ref the registry will accept
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "cache=ghcr.io/${REPOSITORY,,}/buildcache" >> "$GITHUB_OUTPUT"

      # Not conditional on the event: a pull request pushes nothing, but it
      # still wants to read the build cache rather than rebuild eight gigabytes.
      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One package, two tag families: `study-*` and the unprefixed rest. The
      # two bare tags -- `study` and `latest` -- clear the prefix themselves.
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: |
            latest=false
            prefix=${{ matrix.prefix }}
          # `type=sha` below carries its own `sha-` prefix, and a prefix set on a
          # tag replaces the one in `flavor` rather than adding to it. Left
          # alone, both targets published `sha-<commit>` and the second
          # overwrote the first, so the two are spelled out.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=${{ matrix.prefix }}sha-
            type=raw,value=study,prefix=,enable=${{ matrix.target == 'study' }}
            type=raw,value=latest,prefix=,enable=${{ matrix.target == 'app' }}
          labels: |
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/pipeline.md

      # Built for this runner's architecture first and loaded, so the next steps
      # can actually run it. The push below reuses every layer.
      - name: Build it
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: emotion-timeline:check
          cache-from: type=registry,ref=${{ steps.name.outputs.cache }}:${{ matrix.target }}
          cache-to: type=registry,ref=${{ steps.name.outputs.cache }}:${{ matrix.target }},mode=${{ matrix.cache }},image-manifest=true,oci-mediatypes=true

      # An image that cannot find its own records is the failure worth catching.
      # The CLI reads them relative to its own file, so a layout mistake in the
      # Dockerfile breaks twenty commands and nothing else would notice.
      - name: It can read its own records
        run: |
          docker run --rm emotion-timeline:check --version
          docker run --rm emotion-timeline:check timeline | tee out.txt
          grep -q "316 segments over 51.6 minutes" out.txt
          grep -q "47 scenes" out.txt
          docker run --rm emotion-timeline:check russian > /dev/null
          docker run --rm emotion-timeline:check errors > /dev/null

      - name: It serves the page
        run: |
          docker run --rm -d --name check -p 127.0.0.1:8000:8000 emotion-timeline:check
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/meta -o meta.json && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/ | grep -q "Emotion Timeline"
          python3 - <<'PY'
          import json
          meta = json.load(open("meta.json"))
          assert meta["demo_available"], "the committed timeline did not ship"
          assert str(meta["ffmpeg_available"]) == "${{ matrix.ffmpeg }}", meta
          print("stages:", meta["stages"], "| pipeline:", meta["pipeline_available"])
          PY
          docker rm -f check

      # Two ways the GPU build goes quietly wrong, and neither shows up on a
      # runner with no card. The wheel can be the CPU one, which would put
      # Whisper on the CPU as well because `transcribe.py` asks torch. And
      # CTranslate2 loads cuBLAS and cuDNN by name rather than through torch, so
      # without the ldconfig entry the classifiers would find the GPU and the
      # transcriber would not.
      - name: It is built for the GPU, and survives not having one
        if: matrix.target == 'app'
        run: |
          docker run --rm --entrypoint bash emotion-timeline:check -c \
            'ldconfig -p | grep -Eq "libcudnn|libcublas"'
          docker run --rm -i --entrypoint python emotion-timeline:check - <<'PY'
          import importlib.util as u
          import ctranslate2, torch
          print("torch", torch.__version__)
          assert "+cu" in torch.__version__, "the CPU wheel shipped by mistake"
          # Left out as 641 MB of JIT nothing here calls. torch importing at
          # all is the check that it was safe to leave out.
          assert u.find_spec("triton") is None, "triton is back, and the image is bigger for it"
          print("cuda on this runner:", torch.cuda.is_available())
          print("ctranslate2 devices:", ctranslate2.get_cuda_device_count())
          PY

      - name: Push it
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=registry,ref=${{ steps.name.outputs.cache }}:${{ matrix.target }}
          provenance: mode=max
          sbom: ${{ matrix.sbom }}

      - name: Say what was published
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.target }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
