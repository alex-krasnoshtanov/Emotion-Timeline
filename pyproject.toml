[project]
name = "emotion-timeline"
version = "0.1.0"
description = "Turning a Russian-language video into a per-scene emotion timeline: dataset, model, error analysis and the pipeline around them"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Oleksii Krasnoshtanov" }]
requires-python = ">=3.12"
keywords = ["nlp", "emotion-classification", "speech-to-text", "whisper", "transformers", "russian"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

# The core install is deliberately light: word error rate, the error-analysis
# pass and the dataset build are all numpy/pandas work. Anything that pulls a
# GPU stack or calls a paid API is an extra, so `pip install emotion-timeline`
# stays under a few seconds for someone who only wants to read the results.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.16",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
]
stt = [
    "faster-whisper>=1.1",
    "assemblyai>=0.34",
]
model = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=3.0",
    "scikit-learn>=1.5",
]
demo = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
emotion-timeline = "emotion_timeline.cli:main"

[project.urls]
Homepage = "https://github.com/alex-krasnoshtanov/Emotion-Timeline"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emotion_timeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["src/emotion_timeline"]
branch = true

# 95% is roughly "every stage has its module and its command tested". It is a
# floor rather than a target: the point is that a stage cannot land with no test
# at all, which is the failure this project is most prone to -- results are easy
# to render and easy to leave unverified.
[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
pretty = true

# The optional extras are not installed in the type-checking environment, and
# most of them ship no stubs anyway. Everything in the core install is checked
# for real. Extend this list as the later stages land.
[[tool.mypy.overrides]]
module = [
    "assemblyai.*",
    "captum.*",
    "datasets.*",
    "faster_whisper.*",
    "sklearn.*",
    "transformers.*",
]
ignore_missing_imports = true
